<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your report - Acity Lost and Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ux-ui.css">

  <!-- Shared styles first, then Group 1 styles -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>

  <!-- The shared header appears here (added by layout.js) -->
  <div id="site-header"></div>

  <main id="main">
    <div class="container report-page">

      <h1 class="report-title">Find your report</h1>
      <p class="report-intro">Type the reference ID you were given when you submitted your report.</p>

      <form id="find-form" class="report-lookup" novalidate>
        <div class="report-lookup-field">
          <label for="reference-input">Reference ID</label>
          <input type="text" id="reference-input" name="referenceId" placeholder="LF-ABC123" autocomplete="off" aria-invalid="false" aria-describedby="reference-error">
          <p class="report-error" id="reference-error" aria-live="polite"></p>
        </div>
        <button type="submit" class="button">Find report</button>
      </form>

      <p class="report-empty" id="not-found-message" role="status" hidden></p>
      <p class="report-form-error" id="lookup-error" role="alert" hidden></p>

      <section class="card report-review" id="result-card" hidden>
        <div class="report-photo" id="result-photo"></div>
        <dl class="report-list" id="result-list"></dl>
      </section>

    </div>
  </main>

  <!-- The shared footer appears here (added by layout.js) -->
  <div id="site-footer"></div>

  <!-- Scripts go last, layout.js first -->
  <script src="js/layout.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/find-report.js"></script>
</body>
</html>
