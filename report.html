<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an item - Acity Lost and Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared styles first, then Group 1 styles -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>

  <!-- The shared header appears here (added by layout.js) -->
  <div id="site-header"></div>

  <main id="main">
    <div class="container report-page">

      <a class="report-back" href="report-type.html">&larr; Back</a>
      <h1 class="report-title" id="page-title">Report a lost item</h1>
      <p class="report-intro">Fill in the details below. You can check everything before you submit.</p>

      <!-- Switch between the Lost form and the Found form -->
      <div class="report-toggle" role="group" aria-label="Report type">
        <button type="button" id="lost-button" aria-pressed="true">I lost an item</button>
        <button type="button" id="found-button" aria-pressed="false">I found an item</button>
      </div>

      <form id="report-form" class="card report-form-card" novalidate>
        <div class="report-fields">

          <div class="report-field report-area-name">
            <label for="item-name">Item name</label>
            <input type="text" id="item-name" maxlength="60" placeholder="e.g. Android Charger" autocomplete="off">
            <p class="report-error" id="item-name-error"></p>
          </div>

          <div class="report-field report-area-category">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select one</option>
            <option>Electronics</option>
            <option>Wallet or cards</option>
            <option>Books</option>
            <option>Clothing</option>
            <option>Bags and luggage</option>
            <option>Other</option>
            </select>
            <p class="report-error" id="category-error"></p>
          </div>

          <div class="report-field report-area-description">
            <label for="description">Description (at least 20 characters)</label>
            <textarea id="description" maxlength="300" placeholder="Colour, brand, or any remarks"></textarea>
            <p class="report-error" id="description-error"></p>
          </div>

          <div class="report-field report-area-location">
            <label for="location" id="location-label">Where did you lose it?</label>
            <select id="location">
              <option value="">Select one</option>
            <option>Library</option>
            <option>Lecture Rooms</option>
            <option>Rec centre</option>
            <option>Sports Field</option>
            <option>Admin block</option>
            <option>Other</option>
            </select>
            <p class="report-error" id="location-error"></p>
            <!-- Shown only when "Other" is chosen -->
            <div class="report-other" id="other-location-box" hidden>
              <label for="other-location">Type the specific place</label>
              <input type="text" id="other-location" maxlength="80" placeholder="e.g. Behind the gym" autocomplete="off">
              <p class="report-error" id="other-location-error"></p>
            </div>
          </div>

          <!-- Only shown on the Found form -->
          <div class="report-field report-area-handoff" id="handoff-box" hidden>
            <label for="handoff">Hand-off location</label>
            <select id="handoff">
              <option value="">Select one</option>
            <option>SCA Office</option>
            <option>Library Frontdesk</option>
            <option>South Gate (Security Desk)</option>
            <option>West Gate (Security Desk)</option>
            <option>Hostel A Reception</option>
            <option>Hostel B Reception</option>
            </select>
            <p class="report-error" id="handoff-error"></p>
          </div>

          <div class="report-field report-area-date">
            <label for="date" id="date-label">When did you lose it?</label>
            <!-- type="date" gives a calendar pop-up. The limits are set in report.js -->
            <input type="date" id="date">
            <p class="report-error" id="date-error"></p>
          </div>

          <div class="report-field report-area-photo">
            <!-- Shown until a photo is chosen -->
            <label class="report-upload" id="upload-box">
              <svg class="report-icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span>Upload image (Optional)<br>JPG or PNG, max 5MB</span>
              <input type="file" id="photo-input" accept="image/png,image/jpeg">
            </label>

            <!-- Shown after a photo is chosen -->
            <div class="report-preview" id="preview-box" hidden>
              <img id="preview-image" alt="Preview of your item">
              <button type="button" class="report-link-button" id="remove-photo-button">Remove image</button>
            </div>
            <p class="report-error" id="photo-error"></p>
          </div>

        </div>

        <div class="report-actions">
          <button type="button" class="button report-outline-button" id="cancel-button">Cancel</button>
          <button type="submit" class="button">Review &rarr;</button>
        </div>
      </form>

    </div>
  </main>

  <!-- The shared footer appears here (added by layout.js) -->
  <div id="site-footer"></div>

  <!-- Scripts go last, layout.js first -->
  <script src="js/layout.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
