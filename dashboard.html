<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard | Campus Lost & Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ux-ui.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="reported-items.css">
  <link rel="stylesheet" href="pending-claims.css">
  <link rel="stylesheet" href="status-controls.css">
  <link rel="stylesheet" href="messages-panel.css">
</head>
<body>
  <!-- PASTE the <header> and <nav> from Group 7's index.html here -->

  <main id="dashboard">
    <section aria-labelledby="dash-title">
      <h2 id="dash-title">My Dashboard</h2>

      <!-- Summary cards: Role 4's script fills in the numbers -->
      <div class="dash-summary">
        <article class="card"><h3>Open</h3><p><strong data-count="open">0</strong></p></article>
        <article class="card"><h3>Claimed</h3><p><strong data-count="claimed">0</strong></p></article>
        <article class="card"><h3>Resolved</h3><p><strong data-count="resolved">0</strong></p></article>
        <article class="card"><h3>Total reports</h3><p><strong data-count="total">0</strong></p></article>
      </div>

      <!-- Tabs -->
      <nav class="dash-tabs" role="tablist" aria-label="Dashboard sections">
        <button type="button" role="tab" id="tabbtn-reported" aria-controls="tab-reported" aria-selected="true" data-tab="reported">Reported Items</button>
        <button type="button" role="tab" id="tabbtn-claims" aria-controls="tab-claims" aria-selected="false" data-tab="claims">Pending Claims</button>
        <button type="button" role="tab" id="tabbtn-resolved" aria-controls="tab-resolved" aria-selected="false" data-tab="resolved">Resolved</button>
        <button type="button" role="tab" id="tabbtn-messages" aria-controls="tab-messages" aria-selected="false" data-tab="messages">Messages</button>
      </nav>
    </section>

    <section id="tab-reported" class="dash-panel" role="tabpanel" aria-labelledby="tabbtn-reported" data-tab-panel="reported">
      <h2>My Reported Items</h2>
      <p class="empty-state" data-empty-for="reported-items-list" hidden>No active reports yet.</p>
      <div id="reported-items-list" class="dash-grid"></div> <!-- Role 2 fills -->
    </section>

    <section id="tab-claims" class="dash-panel" role="tabpanel" aria-labelledby="tabbtn-claims" data-tab-panel="claims" hidden>
      <h2>Pending Claims</h2>
      <div id="claims-list"></div> <!-- Role 3 fills -->
    </section>

    <section id="tab-resolved" class="dash-panel" role="tabpanel" aria-labelledby="tabbtn-resolved" data-tab-panel="resolved" hidden>
      <h2>Resolved Items</h2>
      <p class="empty-state" data-empty-for="resolved-items-list">Nothing resolved yet.</p>
      <div id="resolved-items-list" class="dash-grid"></div> <!-- Role 4 moves cards here -->
    </section>

    <section id="tab-messages" class="dash-panel" role="tabpanel" aria-labelledby="tabbtn-messages" data-tab-panel="messages" hidden>
      <h2>Messages</h2>
      <div id="messages-panel"></div> <!-- Role 5 fills -->
    </section>
  </main>

  <!-- PASTE the <footer> from Group 7's index.html here -->

  <script src="mock-data.js"></script>
 <script src="dashboard-tabs.js"></script>
  <script src="reported-items.js"></script>
  <script src="pending-claims.js"></script>
  <script src="messages-panel.js"></script>
  <script src="status-controls.js"></script> <!-- ALWAYS LAST -->
</body>
</html>
