<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Activity | Campus Lost & Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Group 7's header/nav goes here once available -->

  <main class="dashboard">
    <header class="dashboard-header">
      <h1 class="eyebrow">Activity Dashboard</h1>
    </header>

    

    <nav class="tabs" aria-label="Dashboard sections">
      <button class="tab active" data-tab="reported">My Reported Items</button>
      <button class="tab" data-tab="claims">Pending Claims</button>
      <button class="tab" data-tab="resolved">Resolved</button>
    </nav>

    <section id="reported" class="tab-panel">
      <h2>My Reported Items</h2>
      <!-- Role 2 builds here -->
    </section>

    <section id="claims" class="tab-panel" hidden>
      <h2>Pending Claims</h2>
      <!-- Role 3 builds here -->
    </section>

    <section id="resolved" class="tab-panel" hidden>
      <h2>Resolved Items</h2>
      <!-- Role 4 builds here -->
    </section>
  </main>

  <!-- Group 7's footer goes here once available -->

  <script src="dashboard.js"></script>
</body>
</html>
